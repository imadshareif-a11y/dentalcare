# Railway / Nixpacks — نسخة تجريبية
# Root Directory = جذر المستودع (هذا الملف)

[build]
builder = "NIXPACKS"
buildCommand = "npm --prefix dentalcare-frontend ci && npm --prefix dentalcare-frontend run build && npm --prefix dentalcare-backend ci --omit=dev"

[deploy]
startCommand = "npm --prefix dentalcare-backend start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
